name: CMake on Windows

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}