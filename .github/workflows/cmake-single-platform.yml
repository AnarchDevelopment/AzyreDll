name: CMake on Windows

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Verify Azyre.dll
        shell: pwsh
        run: |
          $dll = "./build/Release/Azyre.dll"

          if (Test-Path $dll) {
              Write-Host "Azyre.dll found: $dll"
          } else {
              Write-Error "Azyre.dll was not generated."
              exit 1
          }
